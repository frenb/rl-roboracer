name: CI

on:
  push:
    branches: [main, master, repo-front-page]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  madscientist:
    name: MadScientist tests (Python + Mongo)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MONGO_URL: mongodb://root:example@localhost:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/madscientist/requirements.txt
      - run: pip install -r docker/madscientist/requirements.txt pytest
      - run: python scripts/ci/run_madscientist_tests.py
      - run: python -m pytest -q rl_agent/test_job_queue.py rl_agent/duck/test_launch.py rl_agent/duck/test_gyms.py

  dashboard:
    name: Dashboard build (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  mcp-console:
    name: MCP console server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/console/package-lock.json
      - run: npm ci
      - run: npm test
