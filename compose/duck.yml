# Microduck overlay: adds the duck-trainer service (mjlab + rsl_rl PPO on
# MuJoCo Warp) next to the roboracer stack. Opt-in:
#
#   docker compose -f docker-compose.yml -f compose/scale.yml -f compose/duck.yml up -d
#
# or `.\scripts\Start-Stack.ps1 -Duck`. Paths are relative to the repo root
# (the first compose file's directory), as in compose/scale.yml.
#
# The container runs the duck job worker (rl_agent/duck/worker.py), which
# claims robot="microduck" jobs from the shared queue. Checkpoints land in
# ../saved_models/microduck/rsl_rl/<experiment>/<run>/ and per-job logs in
# ../saved_models/microduck/jobs/.

services:
  duck-trainer:
    image: ${IMAGE_PREFIX:-}duck_trainer:latest
    build:
      context: ./third_party/microduck_rl
      dockerfile: ../../docker/duck_trainer/Dockerfile
    restart: unless-stopped
    command: python -u /python_ws/src/duck/worker.py
    environment:
      - ROBOT_TYPE=microduck
      - DATABASE_NAME=robotaxi
      - MONGO_URL=${MONGO_URL:-mongodb://root:${MONGO_ROOT_PASSWORD:-example}@mongo:27017/}
      - WANDB_MODE=disabled
      # GPU OpenGL for MuJoCo's offscreen renderer (videos, viewer) under
      # Docker Desktop's WSL2 backend: Mesa's d3d12 driver over /dev/dxg.
      # Without it Mesa falls back to llvmpipe on the CPU.
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    devices:
      - /dev/dxg
    volumes:
      # WSL's D3D12 user-mode libraries, from Docker Desktop's VM (see
      # GALLIUM_DRIVER above).
      - type: bind
        source: /usr/lib/wsl
        target: /usr/lib/wsl
        read_only: true
      # mjlab writes runs under <cwd>/logs; keep them with the other models.
      - type: bind
        source: ../saved_models/microduck
        target: /microduck_rl/logs
      # rl-roboracer side of the integration (the duck job worker lands in
      # rl_agent/duck); mounted like sim-controller's /python_ws/src.
      - type: bind
        source: ./rl_agent
        target: /python_ws/src
      # The car stack's /tmp volume; the worker writes duck_trainer.log
      # there for the dashboard, next to the car's trainer.log.
      - type: volume
        source: tmpdata
        target: /shared_tmp
      # Compiled Warp kernels (several minutes to build on first run).
      - type: volume
        source: duck_warp_cache
        target: /root/.cache/warp
    # mjlab's browser viewer (viser), started on demand by
    # scripts/Watch-Duck.ps1. Host 8080 is the dashboard's log socket.
    ports:
      - "8090:8080"
    shm_size: 8gb

volumes:
  duck_warp_cache:
