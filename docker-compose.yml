# RL stack for the robotaxi Unity gym.
# Run from repo root: `docker compose up -d`
# Then start the Unity client:    `.\scripts\RunClientWrapper.ps1`
#
# Bind-mounts assume this layout (LATEST/ is the repo's parent dir):
#   LATEST/
#     rl-roboracer/         <- this repo
#     saved_models/         <- model checkpoints
#     mongodb/              <- mongo data dir
#     tfrecords/            <- demo trajectories
#     tmp/                  <- tensorboard / runtime scratch

services:
  ros-server:
    image: docker_ros-server:thin
    # Pin the container name so Compose doesn't auto-suffix it with the
    # replica index ("-1"). Without this, the base container ends up
    # named "<project>-ros-server-1", which Docker's embedded DNS then
    # also resolves under the short name "ros-server-1" - colliding
    # with the actual ros-server-1 service brought up by compose/scale.yml
    # and silently routing actor-1's worker to actor-0's container.
    container_name: rl-roboracer-ros-server-base
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SAVED_MODELS_DIR=/saved_models
      - ROBOT_TYPE=robotaxi
      - UNITY_MACHINE_IP=host.docker.internal
    build:
      context: ./docker/ros_server
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ./rl_agent
        target: /python_ws/src
      - type: bind
        source: ../saved_models
        target: /saved_models
    ports:
      - "10000:10000"
      - "50051:50051"
    # ros-server-0 alias keeps the Python default (ros-server-0:50051) working
    # whether or not compose/scale.yml is layered in. With the scale overlay,
    # actors 1..3 reach the additional ros-server-1..3 services by their
    # service names; the overlay does not need to redeclare this alias.
    networks:
      default:
        aliases:
          - ros-server-0
    command: sh -c "./src/start.sh"

  mongo:
    image: bitnami/mongodb:6.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGODB_ROOT_PASSWORD: example
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_ADVERTISED_HOSTNAME: mongo
      MONGODB_REPLICA_SET_KEY: 64321d2b6ce8b4318b337bb1
    ports:
      - "27017:27017"
    volumes:
      - type: bind
        source: ../mongodb
        target: /data/db
      - type: bind
        source: ../mongodb
        target: /bitnami/mongodb

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/

  sim-controller:
    image: sim_controller:latest
    build:
      context: .
      dockerfile: docker/sim_controller/Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SAVED_MODELS_DIR=/saved_models
      - ROBOT_TYPE=robotaxi
      - DATABASE_NAME=robotaxi
      # Silence the per-env-step `ACTION accel=... steer=...` trace from
      # rl_agent/environments/robotaxi_env.py. Each actor emits one
      # ACTION line per step, so under multi-env training this is
      # ~10s of lines per second per actor and dominates robotaxi.out
      # log volume. Flip to 1 (or remove this line) to re-enable the
      # diagnostic, e.g. when validating that N parallel actors are
      # producing independent stochastic actions per step.
      - ROBOTAXI_LOG_ACTIONS=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ./rl_agent
        target: /python_ws/src
      - type: bind
        source: ../saved_models
        target: /saved_models
      - type: bind
        source: ../tfrecords
        target: /tfrecords
      - type: bind
        source: ../tmp
        target: /tmp
      # Read-only mount of the repo's .git so the trainer can stamp
      # git_sha + git_branch on every model + job document. Without
      # this the container can't see ancestral .git (only ./rl_agent
      # is mounted at /python_ws/src, and .git lives in the host's
      # repo root one level up). The provenance lets the future
      # multiverse / research-agent tooling answer "which code
      # version produced this model?" cleanly without timestamp
      # inference. read_only because the trainer never writes to it.
      - type: bind
        source: ./.git
        target: /git_meta
        read_only: true
    ports:
      - "6006:6006"
    # `python -u` forces unbuffered stdout so the dashboard's live log
    # view (which tails this file via WebSocket) updates per-line
    # instead of per-8KB-block. Python switches from line-buffered to
    # block-buffered automatically when it detects stdout is a pipe
    # (via the `| tee`), and -u overrides that.
    # Tensorboard watches TWO directories:
    #   /tmp/active        -> "current/<job_id>/..."   the live job
    #   /tmp/tb_compare    -> "compare/<job_id>/..."   on-demand bucket
    #
    # /tmp/active holds the currently-training job's scalars. Anything
    # else gets moved out by the trainer's move_all_jobs_data() into
    # /tmp/jobsdata (untouched here, so TB does NOT clutter its
    # sidebar with every historical run by default).
    #
    # /tmp/tb_compare is initially empty; the dashboard server (see
    # dashboard/src/server.ts::/set_tb_compare_jobs) symlinks selected
    # /tmp/jobsdata/<job_id> directories into it when the user clicks
    # "Compare in Analysis" on the Models tab. So the compare bucket
    # holds exactly the jobs the user is currently looking at - no
    # more, no less - and the sidebar stays manageable.
    #
    # --reload_interval 5 (down from default 30) so newly-symlinked
    # archived runs show up in TB within ~5s of the user clicking
    # Compare, rather than the user staring at "no scalars" for up to
    # half a minute waiting for TB's next filesystem scan.
    command: sh -c "(tensorboard --bind_all --logdir_spec=current:/tmp/active,compare:/tmp/tb_compare --reload_multifile true --reload_interval 5 &1> /tmp/tb.log) && cd /python_ws/src && python -u robotaxi.py 2>&1 | tee robotaxi.out"
    # No `links:` block. Compose's legacy links: ["ros-server"] would
    # also auto-add per-link aliases of the form
    #   <linked-container>:<service>-<replica-index>
    # i.e. "ros-server-base:ros-server-1". Those aliases are scoped to
    # this container's view of the embedded DNS and SHADOW the network-
    # wide alias "ros-server-1" registered on the dedicated ros-server-1
    # service from compose/scale.yml - meaning sim-controller's actor-1
    # worker silently routes back to the base ros-server container
    # alongside actor-0, while the real ros-server-1 sits idle.
    # On modern Compose networks every service on the default network
    # already resolves its peers by service name and explicit
    # `networks.<net>.aliases:`, so links: is unnecessary.

  dashboard:
    image: node:15.8
    restart: always
    ports:
      - "80:80"
      - "8080:8080"
    environment:
      - DATABASE_NAME=robotaxi
      # Shared secret the dashboard uses to VERIFY the HMAC-signed
      # magic-link decision tokens minted by the madscientist
      # email_bridge. Must match the madscientist service's value.
      - MADSCIENTIST_TOKEN_SECRET=${MADSCIENTIST_TOKEN_SECRET:-}
    volumes:
      - type: bind
        source: ./dashboard
        target: /dashboard
      - type: bind
        source: ./rl_agent
        target: /python_ws/src
      - type: bind
        source: ../tmp
        target: /tmp
    command: sh -c "cd /dashboard && npm start"

  # ---- MadScientist agent -------------------------------------------------
  #
  # Autonomous research + proposal + implementation agent. Three workers
  # (researcher, judge, orchestrator) backed by Mongo's `proposals`
  # collection. Phase 0 (current) ships the container scaffolding +
  # schema + Phase-0-stub heartbeat worker; Phase 1 swaps in the real
  # research / judge / orchestrator implementations.
  #
  # IMPORTANT: MADSCIENTIST_ENABLED defaults to "false". The container
  # starts and idles so it's available for inspection
  # (`docker compose exec madscientist bash`) but does NO LLM calls,
  # NO proposals, NO file edits until the operator flips the env var to
  # "true" and runs `docker compose restart madscientist`. This means
  # bringing the rest of the stack up never accidentally racks up
  # Anthropic / Cursor bills.
  #
  # See:
  #   docker/madscientist/Dockerfile            - container image
  #   docker/madscientist/entrypoint.sh         - boot + gating
  #   rl_agent/madscientist/                    - agent code package
  madscientist:
    image: madscientist:latest
    build:
      context: ./docker/madscientist
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      # ---- Worker gating ---------------------------------------------
      # OFF by default. Flip to "true" once Phase 1 ships + secrets are
      # populated below. Operator then runs:
      #   docker compose restart madscientist
      MADSCIENTIST_ENABLED: ${MADSCIENTIST_ENABLED:-false}

      # ---- Mongo -----------------------------------------------------
      # Same DSN the dashboard server uses (see dashboard/src/server.ts).
      MONGO_URL: ${MONGO_URL:-mongodb://root:example@mongo:27017/}

      # ---- LLM API keys (REQUIRED when MADSCIENTIST_ENABLED=true) ----
      # Both keys go on the host's environment (or .env file); compose
      # pulls them in via the ${VAR:-default} expansion. We don't bake
      # them into the image so the same image is shareable across
      # environments.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}

      # ---- Email bridge ----------------------------------------------
      # Outbound: SMTP. For Gmail use smtp.gmail.com:587 + an app
      # password (not your account password).
      # Inbound: Gmail API push notifications via a Cloud Pub/Sub topic;
      # see Phase 1's email_bridge.py for the OAuth setup walk-through.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      GMAIL_OAUTH_CREDS_PATH: ${GMAIL_OAUTH_CREDS_PATH:-/secrets/gmail_oauth.json}
      # Base URL the email's Approve/Reject/Defer magic-link buttons
      # point at. HTTP routes are on port 80 (8080 is the WebSocket
      # server -> "426 Upgrade Required"). localhost works only when
      # mail is opened on this host; set to a LAN / Tailscale / tunnel
      # URL to click from a phone.
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost}
      # HMAC secret that SIGNS the decision tokens. Must match the
      # dashboard service's MADSCIENTIST_TOKEN_SECRET. Empty => email
      # still sends but without one-click buttons (dashboard link only).
      MADSCIENTIST_TOKEN_SECRET: ${MADSCIENTIST_TOKEN_SECRET:-}
      NOTIFY_POLL_INTERVAL_SECONDS: ${NOTIFY_POLL_INTERVAL_SECONDS:-60}
      DECISION_TOKEN_TTL_SECONDS: ${DECISION_TOKEN_TTL_SECONDS:-604800}

      # ---- Safety / budget knobs -------------------------------------
      # Defaults are intentionally CONSERVATIVE - 1 proposal/day + $250/mo
      # so the first weeks of running don't surprise-bill. Tune as you
      # observe the spend pattern on the dashboard's budget gauge.
      MAX_PROPOSALS_PER_DAY: ${MAX_PROPOSALS_PER_DAY:-1}
      BUDGET_USD_PER_MONTH: ${BUDGET_USD_PER_MONTH:-250}
      RESEARCH_CYCLE_INTERVAL_SECONDS: ${RESEARCH_CYCLE_INTERVAL_SECONDS:-21600}
      OUTCOME_POLL_INTERVAL_SECONDS: ${OUTCOME_POLL_INTERVAL_SECONDS:-300}
      AUTO_REJECT_AFTER_HOURS: ${AUTO_REJECT_AFTER_HOURS:-96}

    volumes:
      # The whole repo, READ-ONLY. Used for:
      #   * Importing rl_agent.madscientist.* (PYTHONPATH=/repo in the
      #     Dockerfile).
      #   * Codebase introspection by the researcher (what
      #     experiment_designs already exist, what reward functions are
      #     in scope, what was the last training result, etc.).
      #   * The orchestrator's `git clone --reference /repo
      #     /worktrees/<id>/` so each implementation worktree shares
      #     object storage with the canonical repo (saves several GB
      #     per worktree).
      # Read-only because we do NOT want a runaway agent rewriting
      # production files outside of a properly-PR'd worktree.
      - type: bind
        source: .
        target: /repo
        read_only: true

      # Worktrees - WRITABLE scratch space, one subdir per active
      # implementation. The orchestrator creates / destroys these.
      # Lives on the host so a container rebuild doesn't lose in-flight
      # worktrees + their PR branches.
      - type: bind
        source: ./worktrees
        target: /worktrees

      # Git metadata for stamping git_sha + git_branch on proposals at
      # draft time. Read-only so the agent can never accidentally
      # write to the actual repo's .git from inside the container.
      # (Same pattern the sim-controller uses for trainer provenance.)
      - type: bind
        source: ./.git
        target: /git_meta
        read_only: true

      # Where secrets land (Gmail OAuth client_secret.json + token).
      # The path is referenced via GMAIL_OAUTH_CREDS_PATH above so the
      # operator can rotate without rebuilding the image. Optional;
      # mount only when email bridge is configured.
      - type: bind
        source: ./secrets
        target: /secrets
        read_only: true

    networks:
      default:
