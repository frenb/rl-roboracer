<text data-box="640,1920" x="790" y="564" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#8a93a6" font-weight="400" text-anchor="start">Keeps previous logs and prints a session banner with the git SHA.</text>
