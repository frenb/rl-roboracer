<text data-box="40,600" x="98" y="409" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">keeps old logs.</text>
<circle cx="76" cy="452" r="4" fill="#8a93a6"/>
<text data-box="40,600" x="98" y="460" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">The watchdog pauses, restarts and resumes</text>
<text data-box="40,600" x="98" y="493" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">when a run wedges.</text>
