<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="0" y="0" width="1920" height="1080" fill="#07090d"/>
<text x="690" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8a93a6" font-weight="700" text-anchor="start" letter-spacing="1.2">AVERAGE SPEED ON THE DONUT TRACK, M/S &#183; 10-TRIAL EVAL &#183; HIGHER IS BETTER</text>
<text x="690" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e6e9ef" font-weight="600" text-anchor="start">Fly brain + copied expert</text>
<text x="690" y="236" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8a93a6" font-weight="400" text-anchor="start">Ridge readout &#183; FlyPyPolicy</text>
<rect x="1170" y="188" width="179.85" height="36" rx="6" fill="#8fa0b8" opacity="0.9"/>
<text x="1363.85" y="216" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="24" fill="#e6e9ef" font-weight="600" text-anchor="start">1.6</text>
<text x="690" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e6e9ef" font-weight="600" text-anchor="start">Fly brain + SAC</text>
<text x="690" y="386" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8a93a6" font-weight="400" text-anchor="start">Four cues &#183; fly_donut</text>
<rect x="1170" y="338" width="296.45" height="36" rx="6" fill="#6E8BFF" opacity="0.9"/>
<text x="1480.45" y="366" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="24" fill="#e6e9ef" font-weight="600" text-anchor="start">2.7</text>
<text x="690" y="506" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e6e9ef" font-weight="600" text-anchor="start">Fly brain + SAC + optic flow</text>
<text x="690" y="536" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8a93a6" font-weight="400" text-anchor="start">Six cues &#183; fly_donut_flow</text>
<rect x="1170" y="488" width="176.00" height="36" rx="6" fill="#40D9FF" opacity="0.9"/>
<text x="1360.00" y="516" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="24" fill="#e6e9ef" font-weight="600" text-anchor="start">1.6</text>
<rect x="670" y="608" width="1220" height="112" rx="14" fill="#10141d" stroke="#5BE37D" stroke-width="1.6"/>
<text x="690" y="656" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#5BE37D" font-weight="600" text-anchor="start">Fly brain + AWAC + BC</text>
<text x="690" y="686" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8a93a6" font-weight="400" text-anchor="start">Expert demos + reward &#183; fly_donut_flow</text>
<rect x="1170" y="638" width="409.20" height="36" rx="6" fill="#5BE37D" opacity="0.9" filter="url(#glow)"/>
<text x="1593.20" y="666" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="24" fill="#5BE37D" font-weight="600" text-anchor="start">3.7</text>
<text x="1170" y="704" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#5BE37D" font-weight="400" text-anchor="start" font-style="italic">2.3&#215; SAC alone &#183; 69% of the no-brain agent</text>
<text x="690" y="806" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#e6e9ef" font-weight="600" text-anchor="start">SAC with no brain</text>
<text x="690" y="836" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8a93a6" font-weight="400" text-anchor="start">Raw 31 numbers &#183; donut_no_hint</text>
<rect x="1170" y="788" width="594.00" height="36" rx="6" fill="#A6A6B8" opacity="0.9"/>
<text x="1778.00" y="816" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="24" fill="#e6e9ef" font-weight="600" text-anchor="start">5.4</text>
<line x1="1764.00" y1="150" x2="1764.00" y2="826" stroke="#A6A6B8" stroke-width="1.2" opacity="0.6" stroke-dasharray="5 6" stroke-linecap="round"/>
<text x="690" y="906" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b7488" font-weight="400" text-anchor="start">Average speed over each episode. Mean of a fresh greedy eval, 10 trials of 5 episodes.</text>
<text x="690" y="930" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b7488" font-weight="400" text-anchor="start">Copied expert and fly_donut are the mean of two such evals. AWAC + BC trials ranged 3.45&#8211;3.90 m/s.</text>
<text x="690" y="954" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b7488" font-weight="400" text-anchor="start">Random actions are not shown: their evals did not record speed.</text>
<text x="1880" y="1056" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b7488" font-weight="400" text-anchor="end">rl-roboracer &#183; fly-brain driver &#183; 2026-09-28</text>
<text x="70" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5BE37D" font-weight="700" text-anchor="start" letter-spacing="1.6">RESULTS &#183; SPEED</text>
<text x="70" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" fill="#e6e9ef" font-weight="700" text-anchor="start">How fast does it</text>
<text x="70" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" fill="#e6e9ef" font-weight="700" text-anchor="start">drive?</text>
<circle cx="76" cy="340" r="4" fill="#8a93a6"/>
<text x="98" y="348" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">SAC with optic flow survives by</text>
<text x="98" y="381" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">crawling at 1.6 m/s, no faster than</text>
<text x="98" y="414" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">the copied expert.</text>
<circle cx="76" cy="457" r="4" fill="#8a93a6"/>
<text x="98" y="465" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">AWAC + BC drives at 3.7 m/s, more</text>
<text x="98" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">than twice as fast.</text>
<circle cx="76" cy="541" r="4" fill="#8a93a6"/>
<text x="98" y="549" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">That is 69% of the no-brain agent's</text>
<text x="98" y="582" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#e6e9ef" font-weight="400" text-anchor="start">5.4 m/s.</text>
<text x="70" y="976" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6b7488" font-weight="400" text-anchor="start" font-style="italic">Next: the same pipeline on a real JetRacer robot car.</text>
</svg>
