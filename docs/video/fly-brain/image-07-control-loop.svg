<text x="1280" y="933" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8a93a6" font-weight="400" text-anchor="middle">10 steps a second &#183; one gym on fly courses &#183; gRPC Reset clears the brain at every episode start</text>
<text x="690" y="972" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8a93a6" font-weight="400" text-anchor="start">* Trace: one number per descending neuron, the 1,314 cells that carry the brain's commands to the body. Each spike adds 1</text>
<text x="690" y="991" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8a93a6" font-weight="400" text-anchor="start">and the value fades with a 0.1 s time constant, so it reads as recent firing rate: 0 when silent, about 5.5 when firing every 20 ms.</text>
<text x="690" y="1015" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8a93a6" font-weight="400" text-anchor="start">&#8224; Readout: the policy network, 1,314 trace values in, two 512-unit layers, two numbers out: [accel, steer]. &#8220;Picks an action&#8221; means one</text>
<text x="690" y="1034" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8a93a6" font-weight="400" text-anchor="start">forward pass per step: in training it samples near its best guess to explore, in evaluation it takes the best guess. AWAC + BC is what trains it.</text>
<text x="1880" y="1064" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6b7488" font-weight="400" text-anchor="end">rl-roboracer &#183; fly-brain driver &#183; 2026-09-28</text>
