<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="utf-8">
  <title>Weakness Map · rl-roboracer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind.init.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <!-- Plotly for the 2D spatial heatmap (same pin as analysis.html). -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    /* The slider track/thumb inherit the dark theme poorly on some
       browsers; nudge them so the weight controls read clearly. */
    input[type="range"] { accent-color: #38bdf8; }
  </style>
</head>
<body class="h-full m-0 font-sans antialiased text-slate-900 dark:text-slate-100 bg-slate-50 dark:bg-[#0b1120]">
  <div class="flex flex-col h-screen w-full">

    <!-- Toolbar -->
    <div class="flex flex-wrap items-center gap-3 px-5 py-3
                bg-white dark:bg-slate-900
                border-b border-slate-200 dark:border-slate-700
                shadow-card relative z-[3] flex-shrink-0">
      <h1 class="text-2xl font-semibold tracking-tight m-0 mr-2">Weakness Map</h1>
      <span data-role="subtitle"
            class="text-xs font-medium text-slate-500 dark:text-slate-400">
        Per-location policy weakness from logged trajectories.
      </span>

      <div class="flex flex-wrap gap-2 ml-auto items-center">
        <div class="relative" data-role="jobpicker">
          <label class="text-xs text-slate-500 dark:text-slate-400">
            Job
            <input data-action="job" type="text" autocomplete="off"
                   placeholder="Type to search jobs…"
                   title="Type part of an experiment-design / reward name, status, or id suffix to filter. Click a row to select; hover a row for full details."
                   class="ml-1 px-2 py-1 text-xs
                          border border-slate-300 dark:border-slate-600
                          bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100
                          rounded-md shadow-card min-w-[22rem] align-middle">
          </label>
          <!-- Custom searchable dropdown (replaces the native <datalist> so
               each row can show a status badge + finished-time and expose a
               hover detail card). Anchored to the relative parent. -->
          <div data-role="job-panel"
               class="hidden absolute right-0 mt-1 w-[30rem] max-h-[60vh] overflow-y-auto
                      rounded-lg border border-slate-200 dark:border-slate-700
                      bg-white dark:bg-slate-900 shadow-2xl z-[50] py-1 text-xs"></div>
          <!-- Hover detail card, positioned to the LEFT of the panel (the Job
               control sits at the right edge of the toolbar). -->
          <div data-role="job-card"
               class="hidden absolute z-[60] w-[23rem] p-3 leading-relaxed
                      rounded-lg border border-slate-200 dark:border-slate-700
                      bg-white dark:bg-slate-900 shadow-2xl text-xs
                      text-slate-700 dark:text-slate-200"></div>
        </div>
        <label class="text-xs text-slate-500 dark:text-slate-400">
          Layer
          <select data-action="layer"
                  class="ml-1 appearance-none select-chevron pr-7 px-2 py-1 text-xs
                         border border-slate-300 dark:border-slate-600
                         bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100
                         rounded-md shadow-card">
            <option value="weakness" selected>Weakness (blend)</option>
            <option value="crash">Crash rate</option>
            <option value="speed">Speed (slow = weak)</option>
            <option value="risk">Risk (pre-crash)</option>
            <option value="visits">Visit density</option>
          </select>
        </label>
        <button data-action="refresh" class="btn-base btn-secondary"
                title="Re-pull logs and rebuild the heatmap.">Refresh</button>
        <label class="text-xs text-slate-500 dark:text-slate-400 inline-flex items-center gap-1">
          <input type="checkbox" data-action="auto" class="align-middle">
          Auto&nbsp;(10s)
        </label>
      </div>
    </div>

    <!-- Secondary controls: bins / limit / minVisits + blend weights -->
    <div class="flex flex-wrap items-center gap-x-6 gap-y-2 px-5 py-2
                bg-slate-50 dark:bg-slate-900/60
                border-b border-slate-200 dark:border-slate-700
                text-xs text-slate-500 dark:text-slate-400 flex-shrink-0">
      <label class="inline-flex items-center gap-2">Bins
        <input type="number" data-action="bins" value="48" min="8" max="200" step="4"
               class="w-16 px-2 py-1 rounded-md border border-slate-300 dark:border-slate-600
                      bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100"></label>
      <label class="inline-flex items-center gap-2">Episodes
        <input type="number" data-action="limit" value="500" min="10" max="5000" step="50"
               class="w-20 px-2 py-1 rounded-md border border-slate-300 dark:border-slate-600
                      bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100"></label>
      <label class="inline-flex items-center gap-2">Min visits/cell
        <input type="range" data-action="minvisits" min="1" max="30" value="3" class="w-28">
        <span data-role="minvisits-val" class="tabular-nums w-6">3</span></label>

      <span class="opacity-50">|</span>
      <span class="font-medium">Blend weights:</span>
      <label class="inline-flex items-center gap-2">Crash
        <input type="range" data-action="w-crash" min="0" max="1" step="0.05" value="0.5" class="w-24">
        <span data-role="w-crash-val" class="tabular-nums w-8">0.50</span></label>
      <label class="inline-flex items-center gap-2">Slow
        <input type="range" data-action="w-slow" min="0" max="1" step="0.05" value="0.3" class="w-24">
        <span data-role="w-slow-val" class="tabular-nums w-8">0.30</span></label>
      <label class="inline-flex items-center gap-2">Risk
        <input type="range" data-action="w-risk" min="0" max="1" step="0.05" value="0.2" class="w-24">
        <span data-role="w-risk-val" class="tabular-nums w-8">0.20</span></label>

      <span data-role="status" class="ml-auto text-slate-400 dark:text-slate-500">idle</span>
    </div>

    <!-- Plot -->
    <div class="flex-1 min-h-0 relative">
      <div data-role="plot" class="absolute inset-0"></div>
      <div data-role="empty"
           class="absolute inset-0 hidden items-center justify-center text-sm text-slate-400">
        No trajectory data for this job yet.
      </div>
    </div>
  </div>

  <script>
  (function () {
    const $ = (sel) => document.querySelector(sel);
    const plotEl = $('[data-role="plot"]');
    const emptyEl = $('[data-role="empty"]');
    const statusEl = $('[data-role="status"]');
    const jobInput = $('[data-action="job"]');
    const jobPanel = $('[data-role="job-panel"]');
    const jobCard = $('[data-role="job-card"]');
    const layerSel = $('[data-action="layer"]');

    let lastData = null;     // last /weakness_map payload
    let autoTimer = null;

    // Custom searchable job-picker state. `allJobs` holds the full job docs
    // (newest-first); the panel renders filtered rows from it, and the hover
    // card reads a job's fields straight off jobById. The <input> is a SEARCH
    // box only — the actual selection lives in selectedJobId, so a label
    // refresh (status change) or the user editing the search text never
    // silently drops the current heatmap's job.
    let allJobs = [];
    const jobById = new Map();
    let selectedJobId = '';
    let panelOpen = false;
    function currentJobId() { return selectedJobId; }

    const ctrl = {
      bins: () => clampInt($('[data-action="bins"]').value, 8, 200, 48),
      limit: () => clampInt($('[data-action="limit"]').value, 10, 5000, 500),
      minVisits: () => clampInt($('[data-action="minvisits"]').value, 1, 30, 3),
      wCrash: () => parseFloat($('[data-action="w-crash"]').value) || 0,
      wSlow: () => parseFloat($('[data-action="w-slow"]').value) || 0,
      wRisk: () => parseFloat($('[data-action="w-risk"]').value) || 0,
      layer: () => layerSel.value,
      jobId: () => currentJobId(),
    };

    function clampInt(v, lo, hi, dflt) {
      const n = parseInt(v, 10);
      if (!isFinite(n)) return dflt;
      return Math.max(lo, Math.min(hi, n));
    }

    function setStatus(msg) { statusEl.textContent = msg; }

    // ---- Job dropdown ------------------------------------------------
    function jobIdOf(j) {
      if (j && j._id && typeof j._id === 'object' && j._id.$oid) return j._id.$oid;
      return j && j._id != null ? String(j._id) : '';
    }
    function jobName(j) {
      return j.experiment_design_name || j.reward_design_name || j.job_type || 'job';
    }
    function jobLabel(j) {
      const id = jobIdOf(j);
      const short = id.slice(-6);
      const status = j.status ? ` · ${j.status}` : '';
      return `${jobName(j)} …${short}${status}`;
    }
    // Recency key for ordering the dropdown newest-first. Prefer an explicit
    // date field, but fall back to the ObjectId's embedded creation time
    // (its first 4 bytes are unix seconds) when both are absent. Jobs saved
    // WITHOUT create_date/update_date - the New-job form, Clone-Job, EVAL
    // jobs queued from the Models tab, and trainer-completed jobs all omit
    // them - would otherwise all collapse to epoch 0 and sink beneath the
    // ~1000 older dated jobs, which is why a just-finished TRAIN job looked
    // like it "wasn't added" (it was, just buried at the bottom).
    function jobTimeKey(j) {
      const d = Date.parse(j.ended_at || j.update_date || j.create_date || '');
      if (!isNaN(d)) return d;
      const id = jobIdOf(j);
      return /^[0-9a-fA-F]{8}/.test(id) ? parseInt(id.slice(0, 8), 16) * 1000 : 0;
    }

    // ---- Small formatting helpers ------------------------------------
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function parseMs(v) { const d = Date.parse(v || ''); return isNaN(d) ? null : d; }
    function relTime(ms) {
      if (ms == null) return '';
      const s = Math.round((Date.now() - ms) / 1000);
      if (s < 0) return 'in the future';
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.round(m / 60);
      if (h < 48) return `${h}h ago`;
      const d = Math.round(h / 24);
      return `${d}d ago`;
    }
    function absTime(ms) { return ms == null ? '—' : new Date(ms).toLocaleString(); }
    // The "finished" moment + a human label describing which timestamp it is.
    // TRAIN/EVAL jobs get `ended_at` on completion; running/queued jobs have
    // none, so we describe start/created time instead.
    function jobWhen(j) {
      const ended = parseMs(j.ended_at);
      if (ended != null) return { ms: ended, verb: 'finished' };
      const started = parseMs(j.started_at);
      if (started != null) return { ms: started, verb: 'started' };
      const created = parseMs(j.create_date) ??
        (/^[0-9a-fA-F]{8}/.test(jobIdOf(j)) ? parseInt(jobIdOf(j).slice(0, 8), 16) * 1000 : null);
      return { ms: created, verb: 'created' };
    }
    function statusTone(status) {
      const s = String(status || '').toUpperCase();
      if (s.includes('DONE') || s.includes('SUCC')) return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
      if (s.includes('FAIL') || s.includes('CANCEL') || s.includes('ERROR')) return 'bg-rose-500/15 text-rose-300 border-rose-500/30';
      if (s.includes('PROGRESS') || s.includes('RUN')) return 'bg-sky-500/15 text-sky-300 border-sky-500/30';
      if (s.includes('PAUSE')) return 'bg-amber-500/15 text-amber-300 border-amber-500/30';
      return 'bg-slate-500/15 text-slate-300 border-slate-500/30';
    }
    function statusBadge(status) {
      const s = escapeHtml(status || 'unknown');
      return `<span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-semibold border whitespace-nowrap ${statusTone(status)}">${s}</span>`;
    }
    // Per-client change cursor for /get_jobs (this tab has no WebSocket,
    // so it polls). Sent as ?since=<v>; advanced from the X-Coll-Version
    // header. This returns a cheap NO_CHANGES when nothing changed, but -
    // unlike the old shared-flag path - is per-client, so it never races
    // other tabs into a false NO_CHANGES that would leave job statuses
    // (NOT_STARTED -> RUNNING -> DONE) stale in the dropdown.
    let jobsVer = 0;
    async function loadJobs() {
      try {
        const r = await fetch(`/get_jobs?since=${jobsVer}`);
        if (!r.ok) return;
        const v = parseInt(r.headers.get('X-Coll-Version') || '', 10);
        if (!isNaN(v)) jobsVer = v;
        const txt = await r.text();
        if (txt === 'NO_CHANGES') return;
        const jobs = JSON.parse(txt);
        if (!Array.isArray(jobs)) return;

        const firstBuild = allJobs.length === 0;
        // Most-recently-finished first (jobTimeKey now prefers ended_at, then
        // the date fields, then the ObjectId's embedded creation time) so the
        // freshest jobs surface at the top of the picker.
        jobs.sort((a, b) => jobTimeKey(b) - jobTimeKey(a));
        allJobs = jobs;
        jobById.clear();
        for (const j of jobs) { const id = jobIdOf(j); if (id) jobById.set(id, j); }

        // Keep the search box showing the current selection's (possibly
        // updated) label, but never clobber what the user is actively typing.
        if (selectedJobId && jobById.has(selectedJobId)
            && document.activeElement !== jobInput) {
          jobInput.value = jobLabel(jobById.get(selectedJobId));
        }

        // Default to a RUNNING job on the first build only.
        if (firstBuild && !selectedJobId) {
          const running = jobs.find((j) => String(j.status).toUpperCase().includes('RUN'));
          if (running) {
            selectedJobId = jobIdOf(running);
            jobInput.value = jobLabel(running);
          }
        }

        // If the dropdown is open, re-render so statuses / finished-times
        // stay live under the 8s refresh.
        if (panelOpen) renderPanel();
      } catch (e) { /* ignore */ }
    }

    // ---- Custom dropdown: filtering, rendering, selection, hover card ----
    function filteredJobs() {
      const q = jobInput.value.trim().toLowerCase();
      // When the box shows the current selection's exact label, treat it as
      // "no filter" so opening the panel shows the full list, not just the
      // one selected row.
      const selLabel = selectedJobId && jobById.has(selectedJobId)
        ? jobLabel(jobById.get(selectedJobId)).toLowerCase() : '';
      const eff = (!q || q === selLabel) ? '' : q;
      let rows = allJobs;
      if (eff) {
        rows = allJobs.filter((j) => {
          const hay = [
            jobName(j), j.status, j.job_type, j.course_type,
            j.gym_name, jobIdOf(j),
          ].join(' ').toLowerCase();
          return hay.includes(eff);
        });
      }
      return rows.slice(0, 300); // cap for render cost with ~1k jobs
    }

    function rowHtml(j) {
      const id = jobIdOf(j);
      const when = jobWhen(j);
      const sel = id === selectedJobId;
      const pct = Number(j.percent_complete);
      const pctTxt = (j.status && String(j.status).toUpperCase().includes('PROGRESS')
        && isFinite(pct)) ? ` · ${pct.toFixed(0)}%` : '';
      return `
        <div data-jobrow="${escapeHtml(id)}"
             class="flex items-center gap-2 px-2.5 py-1.5 cursor-pointer
                    ${sel ? 'bg-sky-500/10' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}">
          <div class="min-w-0 flex-1">
            <div class="truncate font-medium text-slate-800 dark:text-slate-100">
              ${escapeHtml(jobName(j))}
              <span class="font-mono text-[10px] text-slate-400">…${escapeHtml(id.slice(-6))}</span>
            </div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400">
              ${escapeHtml(when.verb)} ${escapeHtml(relTime(when.ms))}${pctTxt}
            </div>
          </div>
          ${statusBadge(j.status)}
        </div>`;
    }

    function renderPanel() {
      const rows = filteredJobs();
      if (!rows.length) {
        jobPanel.innerHTML =
          '<div class="px-3 py-3 text-slate-400">No matching jobs.</div>';
        return;
      }
      jobPanel.innerHTML = rows.map(rowHtml).join('');
    }

    function openPanel() {
      renderPanel();
      jobPanel.classList.remove('hidden');
      panelOpen = true;
    }
    function closePanel() {
      jobPanel.classList.add('hidden');
      panelOpen = false;
      hideCard();
    }
    function selectJob(id) {
      const j = jobById.get(id);
      if (!j) return;
      selectedJobId = id;
      jobInput.value = jobLabel(j);
      closePanel();
      fetchMap();
    }

    // Hover card: rich per-job detail so the operator can assess a job
    // before committing to it. Positioned to the LEFT of the panel, vertically
    // aligned to the hovered row (both are absolute inside the relative
    // [data-role="jobpicker"] container).
    function cardHtml(j) {
      const kv = [];
      const push = (k, v) => { if (v != null && v !== '') kv.push([k, v]); };
      const started = parseMs(j.started_at), ended = parseMs(j.ended_at);
      const dur = (started != null && ended != null && ended >= started)
        ? (() => { const s = Math.round((ended - started) / 1000);
            const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
            return h ? `${h}h ${m}m` : `${m}m`; })()
        : null;
      push('Type', j.job_type);
      push('Course', (j.course_type && j.course_type !== 'trainer default') ? j.course_type : 'donut');
      push('Gym', j.gym_name);
      push('Reward design', j.reward_design_name);
      push('Experiment design', j.experiment_design_name);
      if (j.num_iterations != null && j.num_iterations !== '')
        push('Iterations', Number(j.num_iterations).toLocaleString());
      if (j.num_trials != null && j.num_trials !== '')
        push('Trials', String(j.num_trials));
      if (j.training_steps != null) push('Training steps', Number(j.training_steps).toLocaleString());
      push('Created', absTime(parseMs(j.create_date) ??
        (/^[0-9a-fA-F]{8}/.test(jobIdOf(j)) ? parseInt(jobIdOf(j).slice(0, 8), 16) * 1000 : null)));
      if (started != null) push('Started', absTime(started));
      if (ended != null) push('Finished', absTime(ended));
      if (dur) push('Duration', dur);
      if (j.trainer_git_branch || j.trainer_git_sha)
        push('Git', `${escapeHtml(j.trainer_git_branch || '')} ${(j.trainer_git_sha || '').slice(0, 8)}`.trim());

      const pct = Number(j.percent_complete);
      const progressBar = (j.status && String(j.status).toUpperCase().includes('PROGRESS') && isFinite(pct))
        ? `<div class="mt-2"><div class="h-1.5 w-full rounded bg-slate-200 dark:bg-slate-700 overflow-hidden">
             <div class="h-full bg-sky-400" style="width:${Math.max(0, Math.min(100, pct)).toFixed(1)}%"></div>
           </div><div class="text-[10px] text-slate-400 mt-0.5">${pct.toFixed(1)}% complete</div></div>`
        : '';
      const errBlock = j.eval_error
        ? `<div class="mt-2 p-1.5 rounded bg-rose-500/10 border border-rose-500/30 text-rose-300
                     text-[10px] font-mono whitespace-pre-wrap break-words max-h-24 overflow-auto">${escapeHtml(String(j.eval_error).slice(0, 600))}</div>`
        : '';

      const rows = kv.map(([k, v]) =>
        `<div class="flex gap-2"><span class="w-28 shrink-0 text-slate-400">${escapeHtml(k)}</span>
           <span class="min-w-0 break-words text-slate-700 dark:text-slate-200">${escapeHtml(v)}</span></div>`).join('');

      return `
        <div class="flex items-center justify-between gap-2 mb-1.5">
          <div class="font-semibold text-slate-800 dark:text-slate-100 truncate">${escapeHtml(jobName(j))}</div>
          ${statusBadge(j.status)}
        </div>
        <div class="font-mono text-[10px] text-slate-400 mb-2 select-all break-all">${escapeHtml(jobIdOf(j))}</div>
        <div class="space-y-0.5">${rows}</div>
        ${progressBar}
        ${errBlock}`;
    }
    function showCard(id, rowEl) {
      const j = jobById.get(id);
      if (!j) { hideCard(); return; }
      jobCard.innerHTML = cardHtml(j);
      jobCard.classList.remove('hidden');
      // Fixed location: upper-right of the list. The card's top-left corner
      // pins to the panel's top-right corner (panel is right-0, so its right
      // edge == the container's right edge => left:100%), and it stays there
      // regardless of which row is hovered.
      jobCard.style.right = 'auto';
      jobCard.style.left = '100%';
      jobCard.style.marginLeft = '8px';
      jobCard.style.top = jobPanel.offsetTop + 'px';
    }
    function hideCard() { jobCard.classList.add('hidden'); }

    // ---- Fetch + render ---------------------------------------------
    async function fetchMap() {
      const jobId = ctrl.jobId();
      if (!jobId) { setStatus('select a job'); return; }
      setStatus('loading…');
      const url = `/weakness_map?job_id=${encodeURIComponent(jobId)}`
        + `&bins=${ctrl.bins()}&limit=${ctrl.limit()}`;
      try {
        const r = await fetch(url);
        const data = await r.json();
        if (!data || !data.ok) { setStatus('error: ' + (data && data.error || r.status)); return; }
        lastData = data;
        render();
        setStatus(`${data.episodes} episodes · ${data.cells.length} cells · ${new Date().toLocaleTimeString()}`);
      } catch (e) {
        setStatus('fetch failed: ' + e);
      }
    }

    // Min-max normalize a sparse value map (object keyed by cell index)
    // into [0,1]. Returns {norm, min, max}.
    function normalize(values) {
      let min = Infinity, max = -Infinity;
      for (const k in values) {
        const v = values[k];
        if (!isFinite(v)) continue;
        if (v < min) min = v; if (v > max) max = v;
      }
      const span = (max - min) || 1;
      const norm = {};
      for (const k in values) norm[k] = (values[k] - min) / span;
      return { norm, min, max };
    }

    function render() {
      if (!lastData) return;
      const { nx, ny, cells, extent, axisNames } = lastData;
      if (!cells.length) {
        emptyEl.classList.remove('hidden'); emptyEl.classList.add('flex');
        Plotly.purge(plotEl);
        return;
      }
      emptyEl.classList.add('hidden'); emptyEl.classList.remove('flex');

      const minV = ctrl.minVisits();
      const layer = ctrl.layer();

      // Build per-cell raw metrics over visited cells that clear the
      // min-visits floor (suppresses single-sample noise).
      const crashRate = {}, speed = {}, risk = {}, visits = {};
      const keyed = [];
      for (const c of cells) {
        const k = c.iy * nx + c.ix;
        visits[k] = c.v;
        if (c.v < minV) continue;
        keyed.push(c);
        crashRate[k] = c.v > 0 ? c.cr / c.v : 0;
        speed[k] = c.sc > 0 ? c.ss / c.sc : 0;
        // Dense pre-crash risk: fraction of this cell's visits that occur
        // within the hazard window before a crash (server-computed `hz`).
        risk[k] = c.v > 0 ? (c.hz || 0) / c.v : 0;
      }

      // Normalize each component across cells to [0,1] so the three blend
      // weights are directly comparable. Weakness = high crash + LOW speed
      // + high pre-crash risk.
      const nCrash = normalize(crashRate).norm;
      const nSpeedRaw = normalize(speed);
      const nRisk = normalize(risk).norm;

      const wc = ctrl.wCrash(), ws = ctrl.wSlow(), wr = ctrl.wRisk();
      const wsum = (wc + ws + wr) || 1;

      // z-grid (row-major: z[iy][ix]); null => transparent gap.
      const z = [];
      for (let iy = 0; iy < ny; iy++) z.push(new Array(nx).fill(null));

      let cmin = Infinity, cmax = -Infinity;
      for (const c of keyed) {
        const k = c.iy * nx + c.ix;
        let val = null;
        if (layer === 'visits') {
          val = visits[k];
        } else if (layer === 'crash') {
          val = crashRate[k];
        } else if (layer === 'speed') {
          val = speed[k];
        } else if (layer === 'risk') {
          val = risk[k];
        } else { // weakness blend
          const slowTerm = (k in nSpeedRaw.norm) ? (1 - nSpeedRaw.norm[k]) : 0;
          val = (wc * (nCrash[k] || 0) + ws * slowTerm + wr * (nRisk[k] || 0)) / wsum;
        }
        if (val == null || !isFinite(val)) continue;
        z[c.iy][c.ix] = val;
        if (val < cmin) cmin = val; if (val > cmax) cmax = val;
      }

      // Pin the blend to a fixed [0,1] so changing the weight sliders
      // visibly shifts the colors instead of being auto-rescaled away.
      // Raw single-metric layers keep auto-scaling for contrast.
      if (layer === 'weakness') { cmin = 0; cmax = 1; }

      // Axis tick coordinates (cell centers).
      const xs = [], ys = [];
      const cw = (extent.xmax - extent.xmin) / nx;
      const ch = (extent.ymax - extent.ymin) / ny;
      for (let ix = 0; ix < nx; ix++) xs.push(extent.xmin + (ix + 0.5) * cw);
      for (let iy = 0; iy < ny; iy++) ys.push(extent.ymin + (iy + 0.5) * ch);

      // For weakness/crash/return-as-weakness, hotter = worse → use a
      // warm scale. For speed/visits, use Viridis (diagnostic, not
      // "good/bad"). "Mean return" is a value, not a weakness, so use a
      // diverging-ish scale.
      const warm = (layer === 'weakness' || layer === 'crash' || layer === 'risk');
      const colorscale = warm ? 'Hot' : 'Viridis';

      const heat = {
        type: 'heatmap',
        x: xs, y: ys, z,
        colorscale,
        reversescale: warm,           // Hot reversed → dark=safe, bright=weak
        zmin: isFinite(cmin) ? cmin : 0,
        zmax: isFinite(cmax) ? cmax : 1,
        hoverongaps: false,
        colorbar: { title: layerTitle(layer), titleside: 'right',
                    tickfont: { color: '#94a3b8' }, titlefont: { color: '#94a3b8' } },
        hovertemplate: `${axisNames[0]}=%{x:.1f}<br>${axisNames[1]}=%{y:.1f}<br>${layerTitle(layer)}=%{z:.3f}<extra></extra>`,
      };

      // Overlay crash terminal points as a faint scatter on weakness/crash.
      const traces = [heat];
      if (layer === 'weakness' || layer === 'crash') {
        const cxs = [], cys = [];
        for (const c of cells) {
          if (c.cr <= 0) continue;
          cxs.push(extent.xmin + (c.ix + 0.5) * cw);
          cys.push(extent.ymin + (c.iy + 0.5) * ch);
        }
        if (cxs.length) {
          traces.push({
            type: 'scattergl', mode: 'markers', x: cxs, y: cys,
            marker: { size: 4, color: 'rgba(255,255,255,0.55)', symbol: 'x' },
            name: 'crashes', hoverinfo: 'skip', showlegend: false,
          });
        }
      }

      const layout = {
        paper_bgcolor: '#0b1120', plot_bgcolor: '#0b1120',
        margin: { l: 50, r: 10, t: 10, b: 40 },
        xaxis: { title: axisNames[0], color: '#94a3b8', gridcolor: '#1e293b',
                 scaleanchor: 'y', scaleratio: 1, constrain: 'domain' },
        yaxis: { title: axisNames[1], color: '#94a3b8', gridcolor: '#1e293b' },
        font: { color: '#cbd5e1' },
        showlegend: false,
      };
      Plotly.react(plotEl, traces, layout, { responsive: true, displaylogo: false });
    }

    function layerTitle(layer) {
      return ({
        weakness: 'weakness', crash: 'crash rate', speed: 'speed',
        risk: 'pre-crash risk', visits: 'visits',
      })[layer] || layer;
    }

    // ---- Auto-refresh ------------------------------------------------
    function setAuto(on) {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      if (on) autoTimer = setInterval(() => { loadJobs(); fetchMap(); }, 10000);
    }

    // ---- Wiring ------------------------------------------------------
    $('[data-action="refresh"]').addEventListener('click', fetchMap);

    // Job picker: the <input> is a live search box; the panel below it is
    // the selectable list.
    function openPicker() { jobInput.select(); openPanel(); }
    jobInput.addEventListener('focus', openPicker);
    // Selecting a row keeps focus on the input (the row mousedown
    // preventDefaults to stay stable), so a subsequent click fires NO focus
    // event - handle click explicitly so re-clicking the box reopens the list.
    jobInput.addEventListener('click', () => { if (!panelOpen) openPicker(); });
    jobInput.addEventListener('input', () => { if (!panelOpen) openPanel(); else renderPanel(); });
    jobInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePanel(); jobInput.blur(); } });

    // Select on mousedown (not click) so we act before the input's blur
    // would otherwise close the panel out from under the pointer.
    jobPanel.addEventListener('mousedown', (e) => {
      const row = e.target.closest('[data-jobrow]');
      if (!row) return;
      e.preventDefault();            // keep focus/selection stable
      selectJob(row.getAttribute('data-jobrow'));
    });
    // Hover a row -> show its detail card.
    jobPanel.addEventListener('mouseover', (e) => {
      const row = e.target.closest('[data-jobrow]');
      if (row) showCard(row.getAttribute('data-jobrow'), row);
    });
    jobPanel.addEventListener('mouseleave', hideCard);

    // Close on outside click / blur (deferred so a row mousedown wins).
    document.addEventListener('mousedown', (e) => {
      if (!e.target.closest('[data-role="jobpicker"]')) closePanel();
    });
    jobInput.addEventListener('blur', () => setTimeout(() => {
      if (document.activeElement !== jobInput
          && !jobPanel.matches(':hover') && !jobCard.matches(':hover')) closePanel();
    }, 150));

    layerSel.addEventListener('change', render);
    $('[data-action="bins"]').addEventListener('change', fetchMap);
    $('[data-action="limit"]').addEventListener('change', fetchMap);
    $('[data-action="auto"]').addEventListener('change', (e) => setAuto(e.target.checked));

    // Slider live-labels + re-render (client-side only, no refetch).
    function bindSlider(action, fmt) {
      const el = $(`[data-action="${action}"]`);
      const lbl = $(`[data-role="${action}-val"]`);
      const upd = () => { if (lbl) lbl.textContent = fmt(el.value); render(); };
      el.addEventListener('input', upd);
    }
    bindSlider('minvisits', (v) => String(v));
    bindSlider('w-crash', (v) => (parseFloat(v) || 0).toFixed(2));
    bindSlider('w-slow', (v) => (parseFloat(v) || 0).toFixed(2));
    bindSlider('w-risk', (v) => (parseFloat(v) || 0).toFixed(2));

    // GoldenLayout posts this when the tab is shown/resized so Plotly
    // recomputes its size after a display:none -> block transition.
    window.addEventListener('message', (ev) => {
      if (ev && ev.data && ev.data.type === 'roboracer:redraw') {
        try { Plotly.Plots.resize(plotEl); } catch (e) { /* ignore */ }
      }
    });

    // ---- Boot --------------------------------------------------------
    (async function init() {
      await loadJobs();
      await fetchMap();
      // Keep job statuses / finished-times fresh even when the heatmap auto-
      // refresh is off. Cheap: the ?since cursor returns NO_CHANGES unless the
      // jobs collection actually changed; when it does, an open picker panel
      // re-renders in place.
      setInterval(loadJobs, 8000);
    })();
  })();
  </script>
</body>
</html>
